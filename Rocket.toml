# Rocket configuration. Any value can be overridden with a ROCKET_<KEY>
# environment variable, e.g. ROCKET_PORT=8080.
[default]
# Localhost only: a reverse proxy in front forwards the public traffic.
address = "127.0.0.1"
port = 63151

# Hosts that haven't reported for this many seconds are removed.
stale_after_secs = 600
# How often stale hosts are deleted from memory.
sweep_interval_secs = 30

# Shared bearer token for PUT and DELETE (Authorization: Bearer <token>).
# Override with ROCKET_API_TOKEN.
api_token = "tondorf.is.cool"

# SQLite file for the report history, relative to the working directory.
database_path = "wuppp.db"
# History older than this is deleted by the sweeper. 0 keeps it forever.
history_retention_days = 30

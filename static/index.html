<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ram Altman</title>
<link rel="icon" id="favicon" type="image/jpeg" href="img/sam-sad.jpg">
<style>
  :root {
    --bg: #404040;        /* page */
    --frame: #5e5e5e;     /* row outline */
    --used: #646464;      /* used RAM segment */
    --ink: #ffffff;
    --muted: #c8c8c8;
    --row-h: clamp(1.6rem, 3vh, 2.1rem);
    --page-w: 128rem;
    --col-min: 19rem;     /* narrowest list column (see layoutColumns) */
    --col-gap: clamp(1.25rem, 2.5vw, 3rem);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body { font-family: "DejaVu Sans", Verdana, "Segoe UI", system-ui, sans-serif; }

  /* Users take one track, Hosts the rest, split into CSS columns of the
     same width (layoutColumns sets the track count), so every bar uses the
     same bytes-per-pixel scale. */
  main {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--col-min)), 1fr));
    gap: 2rem var(--col-gap);
    max-width: var(--page-w);
    margin: 0 auto;
    padding: clamp(0.5rem, 2vh, 1.5rem) clamp(1rem, 6vw, 8rem) clamp(1.5rem, 8vh, 7rem);
  }
  /* Title row: [sad pic] free()   Ram Altman   malloc() [happy pic] */
  .masthead {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 1rem clamp(1rem, 3vw, 3rem);
    max-width: var(--page-w);
    margin: 0 auto;
    padding: clamp(0.75rem, 2.5vh, 2rem) clamp(1rem, 6vw, 8rem) 0;
  }
  h1 {
    margin: 0;
    text-align: center;
    font-weight: 600;
    font-size: clamp(2rem, 4.8vw, 4.4rem);
  }
  .side { display: flex; align-items: center; justify-content: center; gap: 1rem; }
  .side code {
    font-family: "DejaVu Sans Mono", Menlo, Consolas, monospace;
    font-size: clamp(1.25rem, 2.4vw, 2.25rem);
  }
  .pic {
    flex: none;
    width: clamp(3.5rem, 7vw, 6.5rem);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 3px solid var(--frame);
    object-fit: cover;
    background: var(--used);
  }
  .pic.placeholder {
    display: grid;
    place-items: center;
    font-size: clamp(1.75rem, 3.5vw, 3.25rem);
    line-height: 1;
  }
  /* Narrow screens: title on its own line, free()/malloc() below it. */
  @media (max-width: 44rem) {
    .masthead { grid-template-columns: 1fr 1fr; }
    h1 { grid-column: 1 / -1; grid-row: 1; }
  }
  h2 {
    margin: 0 0 0.4rem;
    text-align: center;
    font-weight: 400;
    font-size: clamp(1.5rem, 2.8vw, 2.5rem);
  }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.3rem; }
  /* Hosts flow top to bottom, then into the next column. */
  #hosts { display: block; column-gap: var(--col-gap); }
  #hosts .row { break-inside: avoid; margin-bottom: 0.3rem; }
  /* Thin separator centered in the gap between Users and Hosts, only while
     they are side by side (layoutColumns sets .beside). */
  .beside { position: relative; }
  .beside::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: calc(var(--col-gap) / -2 - 0.5px);
    width: 1px;
    background: var(--frame);
  }

  .row {
    position: relative;
    display: flex;
    gap: 2px;                       /* surface gap between free and used */
    height: var(--row-h);
    padding: 2px;
    border: 2px solid var(--frame);
    border-radius: 3px;
    outline-offset: 2px;
  }
  .row:hover, .row:focus-visible { border-color: #8a8a8a; }
  .free, .used { flex: 0 1 auto; min-width: 0; }
  .free { background: var(--c); border-radius: 2px; }
  .used { background: var(--used); border-radius: 0 2px 2px 0; }
  /* Text layer over the bar: name on the left, free RAM on the right. */
  .text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0 0.9rem;
    pointer-events: none;
    white-space: nowrap;
    font-size: calc(var(--row-h) * 0.5);
    line-height: 1;
    /* White with a black outline: readable on any bar color and on the grey
       it may overflow onto. Eight offset shadows plus a soft one form a smooth
       ~0.065em ring (text-stroke would draw spikes at sharp corners). */
    --o: 0.065em;
    /* Substituted where it is used, so each element's own em applies: the
       smaller RAM numbers get a proportionally thinner outline. */
    --outline:
      calc(-1 * var(--o)) calc(-1 * var(--o)) 0 #000,
      0 calc(-1 * var(--o)) 0 #000,
      var(--o) calc(-1 * var(--o)) 0 #000,
      var(--o) 0 0 #000,
      var(--o) var(--o) 0 #000,
      0 var(--o) 0 #000,
      calc(-1 * var(--o)) var(--o) 0 #000,
      calc(-1 * var(--o)) 0 0 #000,
      0 0 calc(var(--o) * 1.5) #000;
    color: #fff;
    text-shadow: var(--outline);
  }
  .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* Free/total: smaller and slightly dimmed, but still brighter than every
     other grey on the page (brightest: --muted #c8c8c8). Re-applying the
     outline here scales it to this smaller font. */
  .size {
    flex: none;
    font-size: 0.72em;
    color: #dedede;
    text-shadow: var(--outline);
    font-variant-numeric: tabular-nums;
  }

  .status { grid-column: 1 / -1; text-align: center; color: var(--muted); margin: 0; }
  .status:empty { display: none; }

  /* RAM over time, above the columns. */
  .chart {
    max-width: var(--page-w);
    margin: 0 auto;
    padding: clamp(1rem, 4vh, 2.5rem) clamp(1rem, 6vw, 8rem) 0;
  }
  /* "300G Total   100G Free": the space left and right of the pair is twice
     the gap between them (2fr | Total | 1fr | Free | 2fr). Same size as the
     Users/Hosts headings. */
  .totals {
    display: grid;
    grid-template-columns: 2fr auto 1fr auto 2fr;
    margin: 0 0 0.6rem;
    font-size: clamp(1.5rem, 2.8vw, 2.5rem);
    font-weight: 400;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .totals > span:first-child { grid-column: 2; }
  .totals > span:last-child { grid-column: 4; }
  .chart-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.25rem 1.5rem;
    margin-bottom: 0.4rem;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .chart-head h2 { margin: 0; font-size: 1.1rem; font-weight: 600; color: var(--ink); text-align: left; }
  .legend { display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; margin: 0; padding: 0; list-style: none; }
  .legend li { display: flex; align-items: center; gap: 0.4rem; }
  .legend svg { width: 1.6rem; height: 0.8rem; overflow: visible; }
  #chart {
    position: relative;
    height: clamp(8.8rem, 22.4vh, 16rem);
    border: 3px solid var(--frame);
    border-radius: 3px;
  }
  #chart svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #chart .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); margin: 0; }
  .axis text { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .grid { stroke: #535353; stroke-width: 1; }
  .series { fill: none; stroke-linejoin: round; stroke-linecap: round; }
  .user { stroke-width: 1.5; opacity: 0.65; }
  .dashed { stroke-dasharray: 4 3; }
  .all-free { stroke: #fff; stroke-width: 2.5; }
  .all-total { stroke: #bdbdbd; stroke-width: 2; }
  .cross { stroke: #9a9a9a; stroke-width: 1; }
  .dot { stroke: var(--bg); stroke-width: 2; }
  #tip .user-line { display: flex; align-items: center; gap: 0.4rem; color: var(--muted); }
  #tip .user-line .v { margin-left: auto; padding-left: 1rem; font-variant-numeric: tabular-nums; }

  #tip {
    position: fixed;
    z-index: 10;
    pointer-events: none;
    padding: 0.5rem 0.7rem;
    border-radius: 4px;
    background: #222;
    border: 1px solid var(--frame);
    color: var(--ink);
    font-size: 0.875rem;
    line-height: 1.4;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgb(0 0 0 / 0.4);
  }
  #tip[hidden] { display: none; }
  #tip .head { display: flex; align-items: center; gap: 0.4rem; font-weight: 600; }
  #tip .swatch { width: 0.75rem; height: 0.75rem; border-radius: 2px; background: var(--c); }
  #tip .meta { color: var(--muted); }
</style>
</head>
<body>
<header class="masthead">
  <div class="side">
    <img class="pic" data-name="sam-sad" data-fallback="😢" alt="Sad Sam Altman">
    <code>free()</code>
  </div>
  <h1>Ram Altman</h1>
  <div class="side">
    <code>malloc()</code>
    <img class="pic" data-name="sam-happy" data-fallback="😄" alt="Happy Sam Altman">
  </div>
</header>
<section class="chart" aria-labelledby="chart-h">
  <p class="totals" aria-live="polite"><span id="total-all">0G Total</span><span id="total-free">0G Free</span></p>
  <div class="chart-head">
    <h2 id="chart-h">Free vs total RAM, last 2 days</h2>
    <ul class="legend">
      <li><svg viewBox="0 0 26 12" aria-hidden="true"><path class="series all-free" d="M1 6H25"/></svg>free, all</li>
      <li><svg viewBox="0 0 26 12" aria-hidden="true"><path class="series all-total" d="M1 6H25"/></svg>total, all</li>
      <li><svg viewBox="0 0 26 12" aria-hidden="true"><path class="series user" stroke="#bdbdbd" d="M1 3H25"/><path class="series user dashed" stroke="#bdbdbd" d="M1 10H25"/></svg>per user: free / total (faded, in the user's color)</li>
    </ul>
  </div>
  <div id="chart"></div>
</section>
<main>
  <section aria-labelledby="users-h">
    <h2 id="users-h">Users</h2>
    <ol id="users"></ol>
  </section>
  <section aria-labelledby="hosts-h">
    <h2 id="hosts-h">Hosts</h2>
    <ol id="hosts"></ol>
  </section>
  <p class="status" id="status" role="status"></p>
</main>
<div id="tip" hidden></div>

<script>
"use strict";

// The server fills in the API prefix (api::BASE_PATH). The URL is resolved
// relative to the page, so the page also works below a proxy sub-path.
const API = "." + "__API_BASE__" + "/v1/dashboard";
// Fingerprint of this page. API responses carry the server's current one in
// X-Frontend-Version; a mismatch means a new frontend was deployed.
const VERSION = "__FRONTEND_VERSION__";
const RELOAD_GUARD_MS = 60000; // at most one auto-reload per minute
const REFRESH_MS = 5000;

const GiB = 1024 ** 3;
// Bar text: one decimal in GiB, e.g. "8.4G"; rows show "free/total".
const short = (bytes) => (bytes / GiB).toFixed(1) + "G";
const fmt = (bytes) => (bytes / GiB).toFixed(bytes < 10 * GiB ? 1 : 0) + " GiB";
const pct = (free, total) => Math.round((free / total) * 100) + "%";

function ago(iso) {
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  return s < 60 ? `${s}s ago` : `${Math.round(s / 60)}m ago`;
}

// item: {label, color, free, total, tip: [head, ...lines]}; scale: bytes of a full-width bar.
function row(item, scale) {
  const li = document.createElement("li");
  li.className = "row";
  li.tabIndex = 0;
  li.style.setProperty("--c", item.color);
  li.setAttribute("aria-label", `${item.label}: ${fmt(item.free)} free of ${fmt(item.total)}`);

  const used = item.total - item.free;
  for (const [cls, bytes] of [["free", item.free], ["used", used]]) {
    if (bytes <= 0) continue;
    const seg = document.createElement("div");
    seg.className = cls;
    seg.style.width = (bytes / scale) * 100 + "%";
    li.append(seg);
  }
  const text = document.createElement("div");
  text.className = "text";
  const label = document.createElement("span");
  label.className = "label";
  label.textContent = item.label;
  const size = document.createElement("span");
  size.className = "size";
  size.textContent = `${short(item.free)}/${short(item.total)}`;
  text.append(label, size);
  li.append(text);

  li.addEventListener("mouseenter", (e) => showTip(item, e));
  li.addEventListener("mousemove", moveTip);
  li.addEventListener("mouseleave", hideTip);
  li.addEventListener("focus", () => showTip(item, li.getBoundingClientRect()));
  li.addEventListener("blur", hideTip);
  return li;
}

const tip = document.getElementById("tip");
function showTip(item, at) {
  tip.replaceChildren();
  tip.dataset.owner = "row";
  tip.style.setProperty("--c", item.color);
  const head = document.createElement("div");
  head.className = "head";
  const sw = document.createElement("span");
  sw.className = "swatch";
  head.append(sw, item.tip[0]);
  tip.append(head);
  item.tip.slice(1).forEach((line, i) => {
    const d = document.createElement("div");
    if (i > 0) d.className = "meta";
    d.textContent = line;
    tip.append(d);
  });
  tip.hidden = false;
  moveTip(at.clientX !== undefined ? at : { clientX: at.left + 16, clientY: at.bottom });
}
function moveTip(e) {
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > innerWidth - 4) x = e.clientX - w - pad;
  if (y + h > innerHeight - 4) y = e.clientY - h - pad;
  tip.style.left = Math.max(4, x) + "px";
  tip.style.top = Math.max(4, y) + "px";
}
function hideTip() { tip.hidden = true; }

function render(dash) {
  const hosts = dash.hosts;
  if (tip.dataset.owner !== "chart") hideTip(); // the hovered row is about to be replaced

  const users = new Map();
  for (const h of hosts) {
    const u = users.get(h.username) ?? { label: h.username, color: h.color, free: 0, total: 0, hosts: [] };
    u.free += h.free_ram_bytes;
    u.total += h.total_ram_bytes;
    u.hosts.push(h.hostname);
    users.set(h.username, u);
  }
  const userItems = [...users.values()]
    .sort((a, b) => b.free - a.free || a.label.localeCompare(b.label))
    .map((u) => ({
      ...u,
      tip: [
        u.label,
        `${fmt(u.free)} free of ${fmt(u.total)} (${pct(u.free, u.total)})`,
        `${u.hosts.length} host${u.hosts.length === 1 ? "" : "s"}: ${u.hosts.join(", ")}`,
      ],
    }));

  // The same machine can be reported by two users; name the user then.
  const seen = new Map();
  for (const h of hosts) seen.set(h.hostname, (seen.get(h.hostname) ?? 0) + 1);
  const hostItems = hosts.map((h) => ({
    label: seen.get(h.hostname) > 1 ? `${h.hostname} · ${h.username}` : h.hostname,
    color: h.color,
    free: h.free_ram_bytes,
    total: h.total_ram_bytes,
    tip: [
      h.hostname,
      `${fmt(h.free_ram_bytes)} free of ${fmt(h.total_ram_bytes)} (${pct(h.free_ram_bytes, h.total_ram_bytes)})`,
      `user ${h.username} · last report ${ago(h.last_seen)}` +
        (h.timeout_minutes ? ` · timeout ${h.timeout_minutes} min` : ""),
    ],
  }));

  // One scale for both columns (they are equally wide), so a pixel stands for
  // the same number of bytes on both sides. The largest user total is the
  // largest value overall: a host never exceeds its user's sum.
  const scale = Math.max(1, ...userItems.map((u) => u.total));
  const fill = (id, items) =>
    document.getElementById(id).replaceChildren(...items.map((i) => row(i, scale)));
  fill("users", userItems);
  fill("hosts", hostItems);
  hostCount = hosts.length;
  layoutColumns();
  status(hosts.length ? "" : "No hosts are reporting right now.");
  updateTotals(hosts);
}

// Users get one track of the main grid and Hosts the rest, as CSS columns of
// the same width, so a pixel is the same number of bytes in every list.
// More tracks on wider screens; no more host columns than hosts.
const mainEl = document.querySelector("main");
const hostsEl = document.getElementById("hosts");
let hostCount = 0;
function layoutColumns() {
  const cs = getComputedStyle(mainEl);
  const rootPx = parseFloat(getComputedStyle(document.documentElement).fontSize);
  const min = parseFloat(cs.getPropertyValue("--col-min")) * rootPx;
  const gap = parseFloat(cs.columnGap) || 0;
  const width = mainEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  let tracks = Math.max(1, Math.floor((width + gap) / (min + gap)));
  const hostCols = tracks > 1 ? Math.max(1, Math.min(tracks - 1, hostCount)) : 1;
  if (tracks > 1) tracks = hostCols + 1;
  mainEl.style.gridTemplateColumns = `repeat(${tracks}, minmax(0, 1fr))`;
  hostsEl.parentElement.style.gridColumn = tracks > 1 ? `2 / span ${hostCols}` : "";
  hostsEl.parentElement.classList.toggle("beside", tracks > 1);
  hostsEl.style.columnCount = hostCols;
}
addEventListener("resize", layoutColumns);

// Pictures are JPEGs in static/img/ (served at img/): <name>.jpg, else
// <name>.jpeg, else an emoji placeholder.
for (const img of document.querySelectorAll("img[data-name]")) {
  const candidates = ["jpg", "jpeg"].map((ext) => `img/${img.dataset.name}.${ext}`);
  img.addEventListener("error", () => {
    if (candidates.length) {
      img.src = candidates.shift();
      return;
    }
    const placeholder = document.createElement("span");
    placeholder.className = "pic placeholder";
    placeholder.setAttribute("role", "img");
    placeholder.setAttribute("aria-label", img.alt);
    placeholder.textContent = img.dataset.fallback;
    img.replaceWith(placeholder);
  });
  img.src = candidates.shift();
}

// Overall RAM of all live hosts: the "…G Total …G Free" line (whole GiB) and
// the favicon: happy Sam when less than half of it is free (lots of malloc),
// sad otherwise, including when no host is reporting.
function updateTotals(hosts) {
  const free = hosts.reduce((sum, h) => sum + h.free_ram_bytes, 0);
  const total = hosts.reduce((sum, h) => sum + h.total_ram_bytes, 0);
  document.getElementById("total-all").textContent = `${Math.round(total / GiB)}G Total`;
  document.getElementById("total-free").textContent = `${Math.round(free / GiB)}G Free`;

  const href = total > 0 && free / total < 0.5 ? "img/sam-happy.jpg" : "img/sam-sad.jpg";
  const link = document.getElementById("favicon");
  if (link.getAttribute("href") !== href) link.setAttribute("href", href); // avoid refetching
}

function status(text) { document.getElementById("status").textContent = text; }

// Reloads the page when the server runs a different frontend. The guard stops
// a reload loop if a cache keeps serving an old page.
function reloadIfOutdated(serverVersion) {
  if (!serverVersion || serverVersion === VERSION) return false;
  let last = 0;
  try { last = Number(sessionStorage.getItem("frontend-reload-at")) || 0; } catch {}
  if (Date.now() - last < RELOAD_GUARD_MS) return false;
  try { sessionStorage.setItem("frontend-reload-at", String(Date.now())); } catch {}
  location.reload();
  return true;
}

async function refresh() {
  try {
    const res = await fetch(API, { cache: "no-store" });
    if (reloadIfOutdated(res.headers.get("X-Frontend-Version"))) return;
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    render(await res.json());
  } catch (e) {
    status(`Can't reach the API (${e.message}), retrying…`);
  } finally {
    setTimeout(refresh, REFRESH_MS);
  }
}
// ---------------------------------------------------------------------------
// Chart: free vs total RAM of all hosts over time, per-user lines faded.
// The x axis is ln(age + 900 s) (api::TIMELINE_AGE_OFFSET_SECS): recent
// minutes get more room than past hours, without squashing the days.
// ---------------------------------------------------------------------------
const TIMELINE_API = "." + "__API_BASE__" + "/v1/timeline";
const TIMELINE_MS = 15000;
const AGE_OFFSET = 900;
const SVG_NS = "http://www.w3.org/2000/svg";
const chartBox = document.getElementById("chart");
let timeline = null;
let lastPointer = null; // replayed after a redraw so the hover survives it

function svgEl(name, attrs = {}) {
  const e = document.createElementNS(SVG_NS, name);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

function fmtAge(s) {
  s = Math.round(s);
  if (s < 5) return "now";
  if (s < 60) return `${s}s ago`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(s / 3600), rm = Math.round((s % 3600) / 60);
  if (h < 24) return rm ? `${h}h ${rm}m ago` : `${h}h ago`;
  const d = Math.floor(h / 24), rh = h % 24;
  return rh ? `${d}d ${rh}h ago` : `${d}d ago`;
}

// A "nice" GiB step that gives about `n` gridlines up to `max` bytes.
function niceStep(max, n) {
  const raw = max / GiB / n;
  const mag = 10 ** Math.floor(Math.log10(raw || 1));
  const step = [1, 2, 5, 10].find((f) => f * mag >= raw) * mag;
  return step * GiB;
}

function drawChart() {
  if (!timeline) return;
  const W = chartBox.clientWidth, H = chartBox.clientHeight;
  if (!W || !H) return;
  const gen = Date.parse(timeline.generated_at);
  const ages = timeline.samples.map((s) => (gen - Date.parse(s)) / 1000);
  const all = timeline.total;
  const values = [
    ...all.total_ram_bytes,
    ...timeline.users.flatMap((u) => u.total_ram_bytes),
  ].filter((v) => v != null);
  if (!values.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "No reports in the last 2 days.";
    chartBox.replaceChildren(p);
    return;
  }

  const m = { l: 58, r: 14, t: 12, b: 24 };
  const lx = (age) => Math.log(Math.max(0, age) + AGE_OFFSET);
  const lo = lx(timeline.span_secs), hi = lx(0);
  const X = (age) => m.l + ((lx(age) - lo) / (hi - lo)) * (W - m.l - m.r);
  // One bogus report (say 100 PB) would flatten everything else for two
  // days: values above 20x the median total are left out of the scale and
  // drawn clipped at the top edge. The tooltip still shows them in full.
  const totals = all.total_ram_bytes.filter((v) => v != null).sort((a, b) => a - b);
  const cap = 20 * (totals[totals.length >> 1] ?? Infinity);
  const top = Math.max(...values.filter((v) => v <= cap), 1);
  const step = niceStep(top, 4);
  const maxY = Math.max(step, Math.ceil(top / step) * step);
  const Y = (v) => H - m.b - (Math.min(v, maxY * 1.03) / maxY) * (H - m.t - m.b);
  const gib = (v) => v >= 1024 * GiB ? `${+(v / 1024 / GiB).toFixed(1)}T` : `${+(v / GiB).toFixed(1)}G`;
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const free = all.free_ram_bytes.at(-1), total = all.total_ram_bytes.at(-1);
  svg.setAttribute("aria-label", free == null
    ? "RAM over the last 2 days; no hosts are reporting now."
    : `RAM over the last 2 days; now ${fmt(free)} free of ${fmt(total)}.`);

  // Grid and axes.
  const axis = svgEl("g", { class: "axis" });
  for (let v = 0; v <= maxY + 1; v += step) {
    axis.append(svgEl("line", { class: "grid", x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v) }));
    const t = svgEl("text", { x: m.l - 8, y: Y(v) + 4, "text-anchor": "end" });
    t.textContent = gib(v);
    axis.append(t);
  }
  const ticks = [[172800, "2d"], [86400, "1d"], [43200, "12h"], [21600, "6h"], [10800, "3h"],
    [3600, "1h"], [1800, "30m"], [600, "10m"], [0, "now"]].filter(([a]) => a <= timeline.span_secs);
  for (const [a, label] of ticks) {
    const x = X(a);
    axis.append(svgEl("line", { class: "grid", x1: x, x2: x, y1: m.t, y2: H - m.b, "stroke-dasharray": "2 4" }));
    const t = svgEl("text", { x, y: H - 6, "text-anchor": a === 0 ? "end" : a === timeline.span_secs ? "start" : "middle" });
    t.textContent = label;
    axis.append(t);
  }
  svg.append(axis);

  // Paths break where a value is null (nothing live at that time).
  const runs = (vals) => {
    const out = [];
    let cur = null;
    vals.forEach((v, i) => {
      if (v == null) { cur = null; return; }
      if (!cur) out.push((cur = []));
      cur.push([X(ages[i]), Y(v)]);
    });
    return out;
  };
  const line = (vals) => runs(vals)
    .map((r) => "M" + r.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join("L")).join("");

  // Users first (underneath), faded towards grey.
  for (const u of timeline.users) {
    const stroke = `color-mix(in srgb, ${u.color} 60%, #808080)`;
    for (const [vals, cls] of [[u.total_ram_bytes, "series user dashed"], [u.free_ram_bytes, "series user"]]) {
      const p = svgEl("path", { class: cls, d: line(vals) });
      p.style.stroke = stroke;
      svg.append(p);
    }
  }
  svg.append(svgEl("path", { class: "series all-total", d: line(all.total_ram_bytes) }));
  svg.append(svgEl("path", { class: "series all-free", d: line(all.free_ram_bytes) }));

  // Hover: crosshair on the nearest sample, tooltip with every value there.
  const cross = svgEl("g", { visibility: "hidden" });
  const vline = svgEl("line", { class: "cross", y1: m.t, y2: H - m.b });
  const dotFree = svgEl("circle", { class: "dot", r: 4.5, fill: "#fff" });
  const dotTotal = svgEl("circle", { class: "dot", r: 4.5, fill: "#bdbdbd" });
  cross.append(vline, dotTotal, dotFree);
  svg.append(cross);
  const hit = svgEl("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent" });
  svg.append(hit);

  const xs = ages.map(X);
  const hover = (e) => {
    lastPointer = { clientX: e.clientX, clientY: e.clientY };
    const px = e.clientX - svg.getBoundingClientRect().left;
    let i = 0;
    xs.forEach((x, j) => { if (Math.abs(x - px) < Math.abs(xs[i] - px)) i = j; });
    vline.setAttribute("x1", xs[i]);
    vline.setAttribute("x2", xs[i]);
    for (const [dot, v] of [[dotFree, all.free_ram_bytes[i]], [dotTotal, all.total_ram_bytes[i]]]) {
      dot.setAttribute("visibility", v == null ? "hidden" : "inherit");
      if (v != null) { dot.setAttribute("cx", xs[i]); dot.setAttribute("cy", Y(v)); }
    }
    cross.setAttribute("visibility", "visible");
    showChartTip(i, ages[i], lastPointer);
  };
  hit.addEventListener("pointermove", hover);
  hit.addEventListener("pointerleave", () => {
    lastPointer = null;
    cross.setAttribute("visibility", "hidden");
    hideTip();
  });

  chartBox.replaceChildren(svg);
  if (lastPointer) hover(lastPointer);
}

function showChartTip(i, age, at) {
  const at_ = new Date(Date.parse(timeline.samples[i]));
  tip.replaceChildren();
  tip.dataset.owner = "chart";
  const head = document.createElement("div");
  head.className = "head";
  head.textContent = `${fmtAge(age)} · ${at_.toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" })}`;
  tip.append(head);
  const f = timeline.total.free_ram_bytes[i], t = timeline.total.total_ram_bytes[i];
  const sum = document.createElement("div");
  sum.textContent = f == null ? "no hosts reporting" : `all: ${fmt(f)} free of ${fmt(t)} (${pct(f, t)})`;
  tip.append(sum);
  const users = timeline.users
    .filter((u) => u.free_ram_bytes[i] != null)
    .sort((a, b) => b.free_ram_bytes[i] - a.free_ram_bytes[i]);
  for (const u of users) {
    const d = document.createElement("div");
    d.className = "user-line";
    const sw = document.createElement("span");
    sw.className = "swatch";
    sw.style.setProperty("--c", u.color);
    const name = document.createElement("span");
    name.textContent = u.username;
    const v = document.createElement("span");
    v.className = "v";
    v.textContent = `${short(u.free_ram_bytes[i])}/${short(u.total_ram_bytes[i])}`;
    d.append(sw, name, v);
    tip.append(d);
  }
  tip.hidden = false;
  moveTip(at);
}

new ResizeObserver(drawChart).observe(chartBox);

async function refreshTimeline() {
  try {
    const res = await fetch(TIMELINE_API, { cache: "no-store" });
    if (reloadIfOutdated(res.headers.get("X-Frontend-Version"))) return;
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    timeline = await res.json();
    drawChart();
  } catch (e) {
    console.warn("timeline:", e);
  } finally {
    setTimeout(refreshTimeline, TIMELINE_MS);
  }
}
refreshTimeline();

refresh();
</script>
</body>
</html>

openapi: 3.1.0
info:
  title: RAM Dashboard API
  version: 1.0.0
  description: |
    Hosts report their memory usage; the service keeps the latest report per
    host and exposes a dashboard ranked by free RAM (highest first).

    Conventions:
    - All memory values are **bytes** (unsigned 64-bit integers).
    - Timestamps are RFC 3339 / ISO 8601 in UTC.
    - Hostnames are case-insensitive and stored lowercased.
    - Errors always use the `Error` schema.

    Stale hosts: a host that hasn't reported for `stale_after_secs`
    (default 300, set via `ROCKET_STALE_AFTER_SECS`) is removed automatically.
    It disappears from all reads the moment it expires and is deleted from
    memory by a background sweep (`ROCKET_SWEEP_INTERVAL_SECS`, default 30).
    Reporting again brings it back.

servers:
  - url: http://localhost:8000

tags:
  - name: reporting
    description: Used by agents on the hosts to push their data
  - name: dashboard
    description: Read-only views for the frontend

paths:
  /api/v1/hosts/{hostname}:
    parameters:
      - $ref: "#/components/parameters/Hostname"

    put:
      tags: [reporting]
      summary: Report (create or replace) the current memory state of a host
      description: |
        Idempotent upsert. Agents call this periodically. The latest report
        replaces any previous one for the same hostname, and `last_seen` is
        set to the server time when the report arrives.
      operationId: reportHost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostReport"
            example:
              username: alice
              free_ram_bytes: 8589934592
              total_ram_bytes: 17179869184
      responses:
        "200":
          description: Existing host updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "201":
          description: New host registered (or a stale host re-appeared)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "422":
          $ref: "#/components/responses/ValidationError"

    get:
      tags: [dashboard]
      summary: Get the latest report of a single host
      description: Returns 404 if the host is unknown or stale.
      operationId: getHost
      responses:
        "200":
          description: The host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "404":
          $ref: "#/components/responses/NotFound"

    delete:
      tags: [reporting]
      summary: Remove a host from the dashboard
      operationId: deleteHost
      responses:
        "204":
          description: Host removed
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/dashboard:
    get:
      tags: [dashboard]
      summary: Get all hosts ranked by free RAM (descending)
      description: |
        Hosts are sorted by `free_ram_bytes` descending; ties are broken by
        hostname ascending. `rank` starts at 1.
      operationId: getDashboard
      parameters:
        - name: limit
          in: query
          required: false
          description: Return only the top N hosts.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The ranked dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
              example:
                generated_at: "2026-11-12T10:15:00Z"
                stale_after_secs: 300
                host_count: 2
                hosts:
                  - rank: 1
                    hostname: build-01
                    username: alice
                    free_ram_bytes: 25769803776
                    total_ram_bytes: 34359738368
                    free_ram_percent: 75.0
                    last_seen: "2026-11-12T10:14:58Z"
                  - rank: 2
                    hostname: laptop-bob
                    username: bob
                    free_ram_bytes: 4294967296
                    total_ram_bytes: 17179869184
                    free_ram_percent: 25.0
                    last_seen: "2026-11-12T10:14:30Z"

  /health:
    get:
      summary: Liveness probe
      operationId: health
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

components:
  parameters:
    Hostname:
      name: hostname
      in: path
      required: true
      description: Hostname, 1–253 chars of `[A-Za-z0-9.-_]`.
      schema:
        type: string
        minLength: 1
        maxLength: 253
        pattern: "^[A-Za-z0-9._-]+$"

  schemas:
    HostReport:
      type: object
      additionalProperties: false
      required: [username, free_ram_bytes, total_ram_bytes]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 256
          description: Name of the user on the host
        free_ram_bytes:
          type: integer
          format: uint64
          minimum: 0
          description: Free (available) RAM in bytes. Must be <= total_ram_bytes.
        total_ram_bytes:
          type: integer
          format: uint64
          minimum: 1
          description: Total RAM in bytes

    Host:
      type: object
      required: [hostname, username, free_ram_bytes, total_ram_bytes, last_seen]
      properties:
        hostname:
          type: string
        username:
          type: string
        free_ram_bytes:
          type: integer
          format: uint64
        total_ram_bytes:
          type: integer
          format: uint64
        last_seen:
          type: string
          format: date-time

    RankedHost:
      allOf:
        - $ref: "#/components/schemas/Host"
        - type: object
          required: [rank, free_ram_percent]
          properties:
            rank:
              type: integer
              minimum: 1
            free_ram_percent:
              type: number
              description: free / total * 100

    Dashboard:
      type: object
      required: [generated_at, stale_after_secs, host_count, hosts]
      properties:
        generated_at:
          type: string
          format: date-time
        stale_after_secs:
          type: integer
          description: |
            Hosts are dropped this many seconds after their `last_seen`.
            Lets the frontend e.g. fade out hosts that are about to expire.
        host_count:
          type: integer
          description: Number of non-stale hosts (before `limit` is applied)
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/RankedHost"

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    NotFound:
      description: Host not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Malformed JSON or invalid values (e.g. free > total)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
